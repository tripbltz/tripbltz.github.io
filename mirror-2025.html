<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<meta http-equiv="refresh" content="21600" />
		<title>Ward-Smith Mirror</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				color-scheme: dark;
				--bg: #000;
				--primary: rgba(255, 255, 255, 0.98);
				--secondary: rgba(255, 255, 255, 0.68);
				--muted: rgba(255, 255, 255, 0.42);
				--faint: rgba(255, 255, 255, 0.18);
				--glow: rgba(255, 255, 255, 0.1);
				--photo-opacity: 1;
				--photo-focus-opacity: 1;
				--interface-opacity: 1;
				--brightness: 1;
				--pad: clamp(28px, 4.4vw, 82px);
				--transition-slow: 1600ms ease;
				--transition-medium: 700ms ease;
			}

			.theme-morning {
				--secondary: rgba(255, 255, 255, 0.76);
				--muted: rgba(255, 255, 255, 0.5);
				--glow: rgba(255, 255, 255, 0.14);
				--photo-opacity: 1;
				--brightness: 1.08;
			}

			.theme-afternoon {
				--secondary: rgba(255, 255, 255, 0.7);
				--muted: rgba(255, 255, 255, 0.46);
				--photo-opacity: 1;
				--brightness: 1;
			}

			.theme-evening {
				--secondary: rgba(245, 245, 245, 0.62);
				--muted: rgba(245, 245, 245, 0.38);
				--glow: rgba(255, 255, 255, 0.07);
				--photo-opacity: 1;
				--brightness: 0.9;
			}

			.theme-night {
				--primary: rgba(255, 255, 255, 0.86);
				--secondary: rgba(255, 255, 255, 0.48);
				--muted: rgba(255, 255, 255, 0.28);
				--faint: rgba(255, 255, 255, 0.1);
				--glow: rgba(255, 255, 255, 0.035);
				--photo-opacity: 1;
				--photo-focus-opacity: 1;
				--brightness: 0.72;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
				background: var(--bg);
				font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				letter-spacing: 0;
			}

			body {
				color: var(--primary);
				filter: brightness(var(--brightness));
				transition: filter var(--transition-slow);
			}

			.mirror {
				position: relative;
				display: grid;
				grid-template-columns: minmax(340px, 0.86fr) minmax(420px, 1.14fr);
				grid-template-rows: auto 1fr auto;
				gap: clamp(28px, 4vw, 76px);
				width: 100vw;
				height: 100vh;
				padding: var(--pad);
				isolation: isolate;
			}

			.mirror::before,
			.mirror::after {
				content: "";
				position: fixed;
				inset: 0;
				pointer-events: none;
				z-index: -1;
			}

			.mirror::before {
				background:
					radial-gradient(circle at 24% 28%, var(--glow), transparent 30%),
					radial-gradient(circle at 82% 70%, rgba(255, 255, 255, 0.045), transparent 34%),
					#000;
				opacity: 0.95;
				transition: opacity var(--transition-slow);
			}

			.mirror::after {
				background: linear-gradient(90deg, rgba(0, 0, 0, 0.5), transparent 28%, rgba(0, 0, 0, 0.72));
			}

			.time-panel {
				grid-column: 1;
				grid-row: 1;
				align-self: start;
				opacity: var(--interface-opacity);
				transition: opacity var(--transition-slow), transform var(--transition-slow);
			}

			.clock {
				font-size: clamp(86px, 11vw, 190px);
				font-weight: 800;
				line-height: 0.86;
				font-variant-numeric: tabular-nums;
				letter-spacing: 0;
				text-shadow: 0 0 34px rgba(255, 255, 255, 0.08);
			}

			.date {
				margin-top: clamp(18px, 1.5vw, 28px);
				color: var(--secondary);
				font-size: clamp(24px, 2.2vw, 44px);
				font-weight: 500;
			}

			.weather {
				grid-column: 2;
				grid-row: 1;
				justify-self: end;
				align-self: start;
				min-width: min(390px, 100%);
				text-align: right;
				opacity: var(--interface-opacity);
				transition: opacity var(--transition-slow), transform var(--transition-slow);
			}

			.weather-main {
				display: flex;
				align-items: baseline;
				justify-content: flex-end;
				gap: 18px;
				font-size: clamp(42px, 4.9vw, 86px);
				font-weight: 700;
				line-height: 1;
			}

			.weather-icon {
				font-size: 0.8em;
				filter: grayscale(0.2);
			}

			.weather-range {
				margin-top: 16px;
				color: var(--secondary);
				font-size: clamp(18px, 1.45vw, 28px);
				font-weight: 500;
			}

			.weather-summary {
				margin-top: 10px;
				color: var(--muted);
				font-size: clamp(17px, 1.25vw, 24px);
				font-weight: 400;
			}

			.message {
				grid-column: 1;
				grid-row: 2;
				align-self: center;
				max-width: 720px;
				font-size: clamp(44px, 5.6vw, 112px);
				font-weight: 650;
				line-height: 1.02;
				text-wrap: balance;
				opacity: var(--interface-opacity);
				transition: opacity var(--transition-slow), transform var(--transition-slow);
			}

			.message-subtle {
				display: block;
				margin-top: 24px;
				color: var(--muted);
				font-size: clamp(18px, 1.35vw, 27px);
				font-weight: 400;
				line-height: 1.35;
			}

			.photo-stage {
				grid-column: 2;
				grid-row: 2 / 4;
				position: relative;
				align-self: stretch;
				justify-self: stretch;
				min-height: 0;
				opacity: var(--photo-opacity);
				transition: opacity var(--transition-slow), transform var(--transition-slow);
				filter: brightness(calc(1 / var(--brightness)));
			}

			.photo-stage img {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: contain;
				object-position: center right;
				opacity: 0;
				transform: scale(1.015);
				transition: opacity 2600ms ease, transform 9000ms ease;
				will-change: opacity, transform;
			}

			.photo-stage img.active {
				opacity: 1;
				transform: scale(1);
			}

			.photo-focus .photo-stage {
				opacity: var(--photo-focus-opacity);
				transform: scale(1.012);
			}

			.photo-focus .time-panel,
			.photo-focus .weather,
			.photo-focus .message,
			.photo-focus .energy {
				--interface-opacity: 0.56;
			}

			.utility {
				grid-column: 1;
				grid-row: 3;
				align-self: end;
				display: grid;
				gap: 12px;
				max-width: 640px;
				opacity: var(--interface-opacity);
				transition: opacity var(--transition-slow), transform var(--transition-slow);
			}

			.utility-status {
				color: var(--secondary);
				font-size: clamp(20px, 1.55vw, 30px);
				font-weight: 600;
			}

			.utility-grid {
				display: grid;
				grid-template-columns: repeat(4, minmax(88px, 1fr));
				gap: clamp(12px, 1.4vw, 24px);
			}

			.utility-item {
				min-width: 0;
			}

			.utility-label {
				color: var(--muted);
				font-size: clamp(13px, 0.9vw, 17px);
				font-weight: 500;
				text-transform: uppercase;
			}

			.utility-value {
				margin-top: 6px;
				color: var(--primary);
				font-size: clamp(20px, 1.7vw, 34px);
				font-weight: 650;
				font-variant-numeric: tabular-nums;
				white-space: nowrap;
			}

			.energy {
				grid-column: 1;
				grid-row: 3;
			}

			.special-effect {
				position: fixed;
				inset: 0;
				overflow: hidden;
				pointer-events: none;
				z-index: 5;
				opacity: 0.75;
			}

			.effect-particle {
				position: absolute;
				top: -40px;
				color: rgba(255, 255, 255, 0.78);
				font-size: var(--size);
				animation: drift var(--duration) linear infinite;
				animation-delay: var(--delay);
			}

			@keyframes drift {
				from {
					transform: translate3d(0, -8vh, 0) rotate(0deg);
					opacity: 0;
				}
				10% {
					opacity: 0.8;
				}
				to {
					transform: translate3d(var(--sway), 108vh, 0) rotate(180deg);
					opacity: 0;
				}
			}

			@media (orientation: portrait) {
				:root {
					--pad: clamp(34px, 5.2vw, 64px);
				}

				.mirror {
					grid-template-columns: 1fr 1fr;
					grid-template-rows: auto auto minmax(820px, 50vh) auto;
					gap: clamp(30px, 3.2vh, 56px) clamp(26px, 4vw, 58px);
				}

				.mirror::after {
					background: linear-gradient(180deg, rgba(0, 0, 0, 0.46), transparent 24%, transparent 72%, rgba(0, 0, 0, 0.72));
				}

				.clock {
					font-size: clamp(112px, 17vw, 184px);
				}

				.date {
					font-size: clamp(28px, 4vw, 44px);
				}

				.weather {
					grid-column: 2;
					grid-row: 1;
				}

				.weather-main {
					font-size: clamp(54px, 8.5vw, 92px);
				}

				.weather-range,
				.weather-summary {
					font-size: clamp(21px, 3vw, 32px);
				}

				.message {
					grid-column: 1 / 3;
					grid-row: 2;
					align-self: end;
					max-width: 100%;
					font-size: clamp(48px, 7vw, 82px);
				}

				.message-subtle {
					margin-top: 14px;
					font-size: clamp(20px, 2.7vw, 30px);
				}

				.photo-stage {
					grid-column: 1 / 3;
					grid-row: 3;
					width: 100%;
					height: 50vh;
					min-height: 820px;
					max-height: 960px;
					opacity: var(--photo-opacity);
				}

				.photo-stage img {
					object-position: center;
				}

				.energy {
					grid-column: 1 / 3;
					grid-row: 4;
				}

				.utility {
					align-self: end;
					max-width: 760px;
				}

				.utility-status {
					font-size: clamp(22px, 3vw, 34px);
				}

				.utility-grid {
					grid-template-columns: repeat(2, minmax(110px, 1fr));
					gap: 14px 26px;
				}

				.utility-value {
					font-size: clamp(22px, 3.1vw, 34px);
				}
			}

			@media (max-width: 900px) {
				.mirror {
					grid-template-columns: 1fr;
					grid-template-rows: auto auto 1fr auto;
					gap: 28px;
				}

				.weather {
					grid-column: 1;
					grid-row: 2;
					justify-self: start;
					text-align: left;
				}

				.weather-main {
					justify-content: flex-start;
				}

				.message {
					grid-column: 1;
					grid-row: 3;
					align-self: start;
				}

				.photo-stage {
					grid-column: 1;
					grid-row: 3;
					opacity: var(--photo-opacity);
				}

				.photo-stage img {
					object-position: center;
				}

				.energy {
					grid-column: 1;
					grid-row: 4;
					justify-self: start;
					text-align: left;
				}

				.utility-grid {
					grid-template-columns: repeat(2, minmax(110px, 1fr));
				}
			}

			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					animation-duration: 1ms !important;
					animation-iteration-count: 1 !important;
					scroll-behavior: auto !important;
					transition-duration: 1ms !important;
				}
			}
		</style>
	</head>
	<body class="theme-afternoon">
		<main class="mirror" aria-label="Ward-Smith household mirror">
			<section class="time-panel" aria-label="Time and date">
				<div class="clock" id="clock">00:00</div>
				<div class="date" id="date">Sunday 19 July</div>
			</section>

			<section class="weather" aria-label="Weather">
				<div class="weather-main">
					<span class="weather-icon" id="weather-icon" aria-hidden="true">--</span>
					<span id="weather-temp">--&deg;C</span>
				</div>
				<div class="weather-range" id="weather-range">High --&deg; · Low --&deg;</div>
				<div class="weather-summary" id="weather-summary">Weather loading</div>
			</section>

			<section class="message" aria-live="polite">
				<span id="message-main">Good afternoon</span>
				<span class="message-subtle" id="message-subtle">Ward-Smith household</span>
			</section>

			<div class="photo-stage" id="photo-stage" aria-label="Family photo">
				<img alt="" decoding="async" />
				<img alt="" decoding="async" />
			</div>

			<section class="utility energy" aria-label="House energy">
				<div class="utility-status" id="energy-status">Energy status loading</div>
				<div class="utility-grid">
					<div class="utility-item">
						<div class="utility-label">Solar</div>
						<div class="utility-value" id="energy-solar">-- kW</div>
					</div>
					<div class="utility-item">
						<div class="utility-label">Battery</div>
						<div class="utility-value" id="energy-battery">--%</div>
					</div>
					<div class="utility-item">
						<div class="utility-label">House</div>
						<div class="utility-value" id="energy-house">-- kW</div>
					</div>
					<div class="utility-item">
						<div class="utility-label">Grid</div>
						<div class="utility-value" id="energy-grid">-- kW</div>
					</div>
				</div>
			</section>
		</main>
		<div class="special-effect" id="special-effect" aria-hidden="true"></div>

		<script>
			const CONFIG = {
				location: {
					name: "Sprowston",
					latitude: 52.66,
					longitude: 1.32,
					timezone: "Europe/London",
				},
				features: {
					weather: true,
					photos: true,
					energy: true,
					specialDays: true,
					photoFocusMode: true,
				},
				greetings: [
					{ from: 5, to: 12, text: "Good morning", theme: "morning" },
					{ from: 12, to: 17, text: "Good afternoon", theme: "afternoon" },
					{ from: 17, to: 22, text: "Good evening", theme: "evening" },
					{ from: 22, to: 24, text: "Good night", theme: "night" },
					{ from: 0, to: 5, text: "Good night", theme: "night" },
				],
				weather: {
					enabled: true,
					refreshMinutes: 30,
					cacheKey: "wardSmithMirror.weather.v1",
					apiUrl: "https://api.open-meteo.com/v1/forecast",
				},
				photos: {
					enabled: true,
					rotationMs: 60000,
					focusEvery: 3,
					focusDurationMs: 22000,
					images: [
						"img/1-2025.jpeg",
						"img/2-2025.jpeg",
						"img/3-2025.jpeg",
						"img/4-2025.jpeg",
						"img/5-2025.jpeg",
						"img/6-2025.jpeg",
						"img/7-2025.jpeg",
						"img/8-2025.jpeg",
						"img/9-2025.jpeg",
						"img/10-2025.jpeg",
						"img/11-2025.jpeg",
						"img/12-2025.jpeg",
						"img/13-2025.jpeg",
						"img/14-2025.jpeg",
						"img/15-2025.jpeg",
						"img/16-2025.jpeg",
						"img/17-2025.jpeg",
						"img/18-2025.jpeg",
						"img/19-2025.jpeg",
						"img/20-2025.jpeg",
						"img/21-2025.jpeg",
						"img/22-2025.jpeg",
						"img/23-2025.jpeg",
						"img/24-2025.jpeg",
						"img/25-2025.jpeg",
						"img/26-2025.jpeg",
						"img/27-2025.jpeg",
						"img/28-2025.jpeg",
						"img/29-2025.jpeg",
						"img/0225-14.jpeg",
						"img/0325-1.jpeg",
						"img/0325-4.jpeg",
						"img/0425-2.jpeg",
						"img/0425-1.jpeg",
						"img/0525-1.jpeg",
						"img/0525-2.jpeg",
						"img/0525-3.jpeg",
						"img/0925-1.jpeg",
						"img/0925-2.jpeg",
						"img/0925-3.jpeg",
						"img/0925-4.jpeg",
						"img/0925-5.jpeg",
						"img/0925-6.jpeg",
						"img/0925-7.jpeg",
					],
				},
				energy: {
					enabled: true,
					refreshMinutes: 2,
					mode: "api",
					apiUrl: "http://localhost:8011/api/energy",
				},
				specialDays: [
					{ name: "Christmas Day", month: 12, day: 25, type: "christmas", message: "Merry Christmas! 🎄" },
					{ name: "Christmas Eve", month: 12, day: 24, type: "christmas", message: "Christmas Eve 🎄" },
					{ name: "New Year's Eve", month: 12, day: 31, type: "new-year", message: "New Year's Eve" },
					{ name: "New Year's Day", month: 1, day: 1, type: "new-year", message: "Happy New Year!" },
					{ name: "Halloween", month: 10, day: 31, type: "halloween", message: "Happy Halloween" },
					{ name: "Penny's Birthday", month: 5, day: 20, type: "birthday", message: "Happy Birthday Penny! 🎈" },
					{ name: "Anniversary", month: 6, day: 1, type: "anniversary", message: "Happy Anniversary! ❤️" },
				],
			};

			const DOM = {
				body: document.body,
				mirror: document.querySelector(".mirror"),
				clock: document.getElementById("clock"),
				date: document.getElementById("date"),
				messageMain: document.getElementById("message-main"),
				messageSubtle: document.getElementById("message-subtle"),
				weatherIcon: document.getElementById("weather-icon"),
				weatherTemp: document.getElementById("weather-temp"),
				weatherRange: document.getElementById("weather-range"),
				weatherSummary: document.getElementById("weather-summary"),
				photoStage: document.getElementById("photo-stage"),
				photoImages: Array.from(document.querySelectorAll("#photo-stage img")),
				energyStatus: document.getElementById("energy-status"),
				energySolar: document.getElementById("energy-solar"),
				energyBattery: document.getElementById("energy-battery"),
				energyHouse: document.getElementById("energy-house"),
				energyGrid: document.getElementById("energy-grid"),
				specialEffect: document.getElementById("special-effect"),
			};

			const formatters = {
				time: new Intl.DateTimeFormat("en-GB", {
					hour: "2-digit",
					minute: "2-digit",
					hour12: false,
					timeZone: CONFIG.location.timezone,
				}),
				date: new Intl.DateTimeFormat("en-GB", {
					weekday: "long",
					day: "numeric",
					month: "long",
					timeZone: CONFIG.location.timezone,
				}),
			};

			const ClockService = {
				start() {
					this.update();
					setInterval(() => this.update(), 1000);
				},
				update() {
					const now = new Date();
					DOM.clock.textContent = formatters.time.format(now);
					DOM.date.textContent = formatters.date.format(now);
					ThemeManager.update(now);
					SpecialDayManager.update(now);
				},
			};

			const ThemeManager = {
				currentTheme: "",
				getGreeting(date) {
					const hour = Number(
						new Intl.DateTimeFormat("en-GB", {
							hour: "numeric",
							hour12: false,
							timeZone: CONFIG.location.timezone,
						}).format(date)
					);
					return CONFIG.greetings.find((entry) => hour >= entry.from && hour < entry.to) || CONFIG.greetings[1];
				},
				update(date) {
					const greeting = this.getGreeting(date);
					if (this.currentTheme !== greeting.theme) {
						DOM.body.classList.remove("theme-morning", "theme-afternoon", "theme-evening", "theme-night");
						DOM.body.classList.add(`theme-${greeting.theme}`);
						this.currentTheme = greeting.theme;
					}
					if (!SpecialDayManager.activeDay) {
						DOM.messageMain.textContent = greeting.text;
						DOM.messageSubtle.textContent = "Ward-Smith household";
					}
				},
			};

			const SpecialDayManager = {
				activeDay: null,
				effectType: "",
				update(date) {
					if (!CONFIG.features.specialDays) return;
					const parts = new Intl.DateTimeFormat("en-GB", {
						month: "numeric",
						day: "numeric",
						timeZone: CONFIG.location.timezone,
					}).formatToParts(date);
					const month = Number(parts.find((part) => part.type === "month").value);
					const day = Number(parts.find((part) => part.type === "day").value);
					const specialDay = CONFIG.specialDays.find((entry) => entry.month === month && entry.day === day);

					if (!specialDay) {
						this.activeDay = null;
						this.clearEffect();
						return;
					}

					if (this.activeDay && this.activeDay.name === specialDay.name) return;
					this.activeDay = specialDay;
					DOM.messageMain.textContent = specialDay.message;
					DOM.messageSubtle.textContent = specialDay.name;
					this.renderEffect(specialDay.type);
				},
				renderEffect(type) {
					if (this.effectType === type) return;
					this.clearEffect();
					this.effectType = type;

					const effectMap = {
						christmas: { symbol: "·", count: 28 },
						birthday: { symbol: "•", count: 24 },
						anniversary: { symbol: "♡", count: 16 },
						halloween: { symbol: "✦", count: 14 },
						"new-year": { symbol: "✧", count: 18 },
					};
					const effect = effectMap[type];
					if (!effect) return;

					const fragment = document.createDocumentFragment();
					for (let index = 0; index < effect.count; index += 1) {
						const particle = document.createElement("span");
						particle.className = "effect-particle";
						particle.textContent = effect.symbol;
						particle.style.left = `${Math.random() * 100}%`;
						particle.style.setProperty("--size", `${10 + Math.random() * 16}px`);
						particle.style.setProperty("--duration", `${18 + Math.random() * 18}s`);
						particle.style.setProperty("--delay", `${Math.random() * -28}s`);
						particle.style.setProperty("--sway", `${-60 + Math.random() * 120}px`);
						fragment.appendChild(particle);
					}
					DOM.specialEffect.appendChild(fragment);
				},
				clearEffect() {
					this.effectType = "";
					DOM.specialEffect.replaceChildren();
				},
			};

			const WeatherService = {
				lastGood: null,
				start() {
					if (!CONFIG.features.weather || !CONFIG.weather.enabled) return;
					this.loadCached();
					this.refresh();
					setInterval(() => this.refresh(), CONFIG.weather.refreshMinutes * 60 * 1000);
				},
				loadCached() {
					try {
						const cached = JSON.parse(localStorage.getItem(CONFIG.weather.cacheKey));
						if (cached) {
							this.lastGood = cached;
							WeatherView.render(cached);
						}
					} catch (error) {
						console.warn("Weather cache unavailable", error);
					}
				},
				async refresh() {
					try {
						const url = new URL(CONFIG.weather.apiUrl);
						url.search = new URLSearchParams({
							latitude: CONFIG.location.latitude,
							longitude: CONFIG.location.longitude,
							current: "temperature_2m,weather_code,is_day",
							hourly: "temperature_2m,precipitation_probability,weather_code",
							daily: "temperature_2m_max,temperature_2m_min",
							timezone: CONFIG.location.timezone,
							forecast_days: "1",
						}).toString();

						const response = await fetch(url);
						if (!response.ok) throw new Error(`Weather request failed: ${response.status}`);
						const data = await response.json();
						const interpreted = WeatherInterpreter.fromForecast(data);
						this.lastGood = interpreted;
						localStorage.setItem(CONFIG.weather.cacheKey, JSON.stringify(interpreted));
						WeatherView.render(interpreted);
					} catch (error) {
						console.warn("Weather refresh failed", error);
						if (this.lastGood) WeatherView.render(this.lastGood);
					}
				},
			};

			const WeatherInterpreter = {
				fromForecast(data) {
					const currentCode = data.current.weather_code;
					const currentTemp = Math.round(data.current.temperature_2m);
					const high = Math.round(data.daily.temperature_2m_max[0]);
					const low = Math.round(data.daily.temperature_2m_min[0]);
					const summary = this.summarise(data, currentTemp, high, low);

					return {
						icon: this.iconForCode(currentCode, data.current.is_day),
						temp: currentTemp,
						high,
						low,
						summary,
						updatedAt: Date.now(),
					};
				},
				summarise(data, currentTemp, high, low) {
					const now = new Date();
					const currentHour = now.getHours();
					const times = data.hourly.time.map((time) => new Date(time));
					const rainHours = data.hourly.precipitation_probability
						.map((chance, index) => ({ chance, date: times[index] }))
						.filter((entry) => entry.date.getHours() >= currentHour && entry.chance >= 55);

					if (rainHours.length) {
						const firstRain = rainHours[0].date;
						if (firstRain.getHours() === currentHour) {
							const stopping = data.hourly.precipitation_probability.findIndex((chance, index) => {
								const hour = times[index].getHours();
								return hour > currentHour && chance < 35;
							});
							if (stopping > -1) return `Rain easing around ${this.hourLabel(times[stopping])}`;
							return "Rain likely for a while";
						}
						return `Rain expected from ${this.hourLabel(firstRain)}`;
					}

					const afternoonTemps = data.hourly.temperature_2m.filter((temp, index) => {
						const hour = times[index].getHours();
						return hour >= 12 && hour <= 17 && temp !== null;
					});
					const afternoonHigh = Math.max(...afternoonTemps);

					if (currentHour < 11 && low <= 5) return "Cold morning";
					if (currentHour < 13 && afternoonHigh - currentTemp >= 4) return "Warmer this afternoon";
					if (high >= 24) return "Warm day ahead";
					if (low <= 2) return "Cold overnight";
					return "Clear for the rest of the day";
				},
				hourLabel(date) {
					return date.toLocaleTimeString("en-GB", {
						hour: "numeric",
						hour12: true,
						timeZone: CONFIG.location.timezone,
					}).toLowerCase().replace(" ", "");
				},
				iconForCode(code, isDay) {
					if ([0, 1].includes(code)) return isDay ? "☀️" : "🌙";
					if ([2, 3].includes(code)) return "☁️";
					if ([45, 48].includes(code)) return "🌫️";
					if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return "🌧️";
					if ([71, 73, 75, 77, 85, 86].includes(code)) return "❄️";
					if ([95, 96, 99].includes(code)) return "⛈️";
					return "☁️";
				},
			};

			const WeatherView = {
				render(weather) {
					DOM.weatherIcon.textContent = weather.icon;
					DOM.weatherTemp.innerHTML = `${weather.temp}&deg;C`;
					DOM.weatherRange.innerHTML = `High ${weather.high}&deg; · Low ${weather.low}&deg;`;
					DOM.weatherSummary.textContent = weather.summary;
				},
			};

			const PhotoManager = {
				index: -1,
				activeLayer: 0,
				start() {
					if (!CONFIG.features.photos || !CONFIG.photos.enabled || !CONFIG.photos.images.length) {
						DOM.photoStage.hidden = true;
						return;
					}
					this.showNext();
					setInterval(() => this.showNext(), CONFIG.photos.rotationMs);
				},
				showNext() {
					this.index = (this.index + 1) % CONFIG.photos.images.length;
					const nextLayer = 1 - this.activeLayer;
					const nextImage = DOM.photoImages[nextLayer];
					const currentImage = DOM.photoImages[this.activeLayer];
					const src = CONFIG.photos.images[this.index];

					nextImage.onload = () => {
						nextImage.classList.add("active");
						currentImage.classList.remove("active");
						this.activeLayer = nextLayer;
						this.maybeFocus();
					};
					nextImage.src = src;
				},
				maybeFocus() {
					if (!CONFIG.features.photoFocusMode || !CONFIG.photos.focusEvery) return;
					const shouldFocus = this.index > 0 && this.index % CONFIG.photos.focusEvery === 0;
					if (!shouldFocus) return;
					DOM.mirror.classList.add("photo-focus");
					setTimeout(() => DOM.mirror.classList.remove("photo-focus"), CONFIG.photos.focusDurationMs);
				},
			};

			const EnergyService = {
				lastGood: null,
				start() {
					if (!CONFIG.features.energy || !CONFIG.energy.enabled) return;
					this.refresh();
					setInterval(() => this.refresh(), CONFIG.energy.refreshMinutes * 60 * 1000);
				},
				async refresh() {
					try {
						const status = CONFIG.energy.mode === "mock"
							? this.getMockStatus()
							: await this.getCurrentStatus();
						this.lastGood = status;
						EnergyView.render(status);
					} catch (error) {
						console.warn("Energy refresh failed", error);
						EnergyView.render(this.lastGood || this.getMockStatus());
					}
				},
				async getCurrentStatus() {
					const response = await fetch(CONFIG.energy.apiUrl);
					if (!response.ok) throw new Error(`Energy request failed: ${response.status}`);
					return response.json();
				},
				getMockStatus() {
					const hour = new Date().getHours();
					const daylight = Math.max(0, Math.sin(((hour - 6) / 13) * Math.PI));
					const solarGeneration = Number((daylight * 3.4).toFixed(1));
					const houseConsumption = Number((0.8 + (hour >= 17 && hour <= 21 ? 0.7 : 0.2)).toFixed(1));
					const batteryCharging = solarGeneration > houseConsumption + 0.4;
					const gridExport = batteryCharging ? Number((solarGeneration - houseConsumption - 0.5).toFixed(1)) : 0;
					const gridImport = solarGeneration < houseConsumption ? Number((houseConsumption - solarGeneration).toFixed(1)) : 0;
					const batteryPercentage = Math.min(96, Math.max(18, Math.round(58 + daylight * 30 - (hour > 20 ? 12 : 0))));

					return {
						solarGeneration,
						batteryPercentage,
						houseConsumption,
						gridImport,
						gridExport,
						batteryCharging,
					};
				},
				describe(status) {
					if (status.gridExport > 0.2) return "Exporting to grid";
					if (status.batteryCharging) return "Charging battery";
					if (status.solarGeneration >= status.houseConsumption * 0.75) return "Running on solar";
					if (status.gridImport > 0.2) return "Using grid power";
					return "House energy steady";
				},
			};

			const EnergyView = {
				render(status) {
					DOM.energyStatus.textContent = EnergyService.describe(status);
					DOM.energySolar.textContent = `${status.solarGeneration.toFixed(1)} kW`;
					DOM.energyBattery.textContent = `${status.batteryPercentage}%`;
					DOM.energyHouse.textContent = `${status.houseConsumption.toFixed(1)} kW`;
					DOM.energyGrid.textContent = status.gridExport > 0
						? `Export ${status.gridExport.toFixed(1)} kW`
						: `Import ${status.gridImport.toFixed(1)} kW`;
				},
			};

			ClockService.start();
			WeatherService.start();
			PhotoManager.start();
			EnergyService.start();
		</script>
	</body>
</html>
